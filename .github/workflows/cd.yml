name: CD - Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build and deploy
      run: |
        docker compose down || true
        docker compose up --build -d
        sleep 5
        curl http://localhost:5000/health-check || exit 1
